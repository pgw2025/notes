# =============================================================================
# Notes 笔记系统 - Nginx 反向代理配置
# 将此文件放到: /etc/nginx/conf.d/notes.conf
# 如果需要 80 端口独占，把默认 server 禁用：mv /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default.conf.disabled
# =============================================================================
#
# 重要：本配置在 2129 端口监听 HTTPS。
#   - 访问时浏览器必须用：https://101.200.235.216:2129/
#   - 用 http:// 访问会报 400 "The plain HTTP request was sent to HTTPS port"
#   - 如需 HTTP 自动跳转 HTTPS，必须用另一个端口（如 80）监听 HTTP 并 301 跳转，
#     Nginx 不允许同一端口同时处理 HTTP 和 HTTPS。
# =============================================================================

server {
    listen 2129 ssl;
    listen [::]:2129 ssl; # 如果支持 IPv6
    server_name 101.200.235.216;
    charset      utf-8;

    # 证书和私钥的路径
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # 推荐的安全配置（提高 SSL 评级）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;  # 附件/头像最大 20MB

    # ---- 前端静态文件 ----
    root   /usr/share/nginx/notes;
    index  index.html;

    # ---- 日志（按需打开）----
    # access_log  /var/log/nginx/notes.access.log;
    # error_log   /var/log/nginx/notes.error.log warn;

    # --- API 反向代理到 ASP.NET Core Kestrel (127.0.0.1:5000) ---
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        keep-alive;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        # 文件上传允许大尺寸
        client_max_body_size  20m;
    }

    # --- 管理后台静态文件（frontend-admin，vite base=/admin/）---
    location /admin/ {
        alias /usr/share/nginx/notes-admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # 静态资源缓存策略与主站一致
        if ($uri ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$) {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
        if ($uri ~* /admin/index\.html$) {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # --- SPA fallback：除 /api/ 和存在的静态文件外，全部回落到 index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        # 针对静态资源做简单缓存
        if ($uri ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$) {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
        if ($uri ~* /index\.html$) {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 禁止敏感目录访问（防御性）
    location ~* /(Uploads|\.git|.*\.cs$|.*\.csproj$|appsettings.*\.json) {
        deny all;
        return 404;
    }
}
